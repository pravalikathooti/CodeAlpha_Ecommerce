<!DOCTYPE html>
<html>
<head>
    <title>Login - My Store</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
        }

        .header {
            background: #222;
            color: white;
            padding: 18px 50px;
        }

        .header a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .login-container {
            width: 400px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .error {
            color: red;
            text-align: center;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="header">
        <a href="{% url 'home' %}">🏠 Home</a>
        <a href="{% url 'cart' %}">🛒 Cart</a>
    </div>

    <div class="login-container">

        <h1>Login</h1>

        {% if messages %}
            {% for message in messages %}
                <p class="error">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Login
            </button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="{% url 'register' %}">
                Create Account
            </a>
        </div>

    </div>

</body>
</html>
